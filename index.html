<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Productiedashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<style>
:root{--bg:#fff;--bg2:#f2f2f0;--ink:#141414;--mute:#64645f;--line:#d9d9d4;--red:#d3202f;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#121212;--bg2:#1c1c1b;--ink:#f1f1ee;--mute:#9d9d96;--line:#33332f;--red:#ff5a66;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Helvetica Neue",Arial,sans-serif}
a{color:inherit}
.serif,h1,h2,.card b{font-family:Georgia,"Times New Roman",serif}
.wrap{max-width:1100px;margin:0 auto;padding:0 clamp(14px,3vw,28px)}
.mast{border-bottom:3px solid var(--ink);margin-bottom:24px}
.mast .wrap{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding-top:14px;padding-bottom:14px;gap:8px}
.logo{font:700 clamp(1.6rem,5vw,2.8rem)/1 Georgia,serif;text-decoration:none;letter-spacing:-.02em}
.logo i{color:var(--red);font-style:normal}
.right{justify-self:end}
button,select,.btn{font:inherit;cursor:pointer;border:1px solid var(--ink);background:var(--bg);color:var(--ink);padding:7px 14px;border-radius:0}
button:hover:not(:disabled){background:var(--ink);color:var(--bg)}button:disabled{opacity:.4;cursor:default}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.red{background:var(--red);border-color:var(--red);color:#fff}
.red:hover:not(:disabled){background:var(--ink);border-color:var(--ink)}
details{position:relative}summary{list-style:none;cursor:pointer;border:1px solid var(--ink);padding:7px 14px;display:inline-block;font-weight:600}
summary::-webkit-details-marker{display:none}
details nav{position:absolute;z-index:5;top:100%;left:0;margin-top:4px;min-width:190px;background:var(--bg);border:1px solid var(--ink);display:flex;flex-direction:column}
details nav a,details nav button{padding:10px 14px;text-decoration:none;border:0;border-bottom:1px solid var(--line);text-align:left}
details nav a:hover,details nav button:hover{background:var(--ink)!important;color:var(--bg)}
.kop{display:flex;justify-content:space-between;align-items:baseline;border-top:3px solid var(--ink);margin:0 0 14px;padding-top:6px;font-size:1.3rem}
.kop a{font:600 .85rem Arial,sans-serif;color:var(--red)}
.grid2{display:grid;gap:28px;grid-template-columns:minmax(0,2fr) minmax(0,1fr);margin-bottom:32px}
@media(max-width:760px){.grid2{grid-template-columns:1fr}.mast .wrap{grid-template-columns:auto 1fr auto}}
.cards{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));margin-bottom:32px}
.card{display:block;text-decoration:none;border-top:1px solid var(--line);padding-top:8px}
.card:hover b{text-decoration:underline}
.card .k,.kick{color:var(--red);font:700 .75rem Arial,sans-serif;text-transform:uppercase;letter-spacing:.06em}
.card b{display:block;font-size:1.15rem;line-height:1.25}
.card small,.muted{color:var(--mute)}
.thumb{width:100%;aspect-ratio:16/9;object-fit:cover;background:var(--bg2);display:block;margin-bottom:6px}
.stage{position:relative;aspect-ratio:16/9;background:#000;overflow:hidden}
.slide{position:absolute;inset:0;display:none;color:#fff;text-decoration:none}
.slide.on{display:block}
.slide video{width:100%;height:100%;object-fit:cover}
.slide .t{position:absolute;left:0;right:0;bottom:0;padding:40px 16px 14px;background:linear-gradient(transparent,rgba(0,0,0,.85));font:700 clamp(1.1rem,3vw,1.7rem)/1.2 Georgia,serif}
.slide .t small{display:block;font:400 .85rem Arial,sans-serif;color:#ddd;margin-top:2px}
.play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:60px;height:60px;border-radius:50%;background:var(--red)}
.play:after{content:"";position:absolute;left:24px;top:18px;border-left:20px solid #fff;border-top:12px solid transparent;border-bottom:12px solid transparent}
.empty{color:var(--mute);padding:30px 0}
.emb,.emb iframe{position:absolute;inset:0;width:100%;height:100%;border:0}.emb iframe{pointer-events:none}
#video{margin-bottom:32px}#video .stage{max-height:58vh}
.slide .cover{position:absolute;inset:0}
.art iframe{width:100%;aspect-ratio:16/9;border:0;display:block;margin:16px 0;background:#000}
.ctl{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:8px}
.dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}.dots i{width:9px;height:9px;background:var(--line)}.dots i.on{background:var(--red)}
.bar{height:3px;background:var(--line);margin-top:10px}.bar b{display:block;height:100%;width:0;background:var(--red)}
.paper canvas{width:100%;border:1px solid var(--line);display:block;margin-bottom:8px}
.art{max-width:820px;margin:0 auto 40px}
.art h1{font-size:clamp(1.8rem,5vw,2.8rem);line-height:1.1;margin:6px 0}
.art video,.art audio{width:100%;display:block;margin:16px 0}.art video{background:#000;max-height:75vh}
.art p{white-space:pre-wrap;font-size:1.05rem}
.h1{font-size:2rem;margin:0 0 12px}
.kbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.spread{display:flex;gap:8px;justify-content:center;align-items:flex-start;background:var(--bg2);padding:12px;min-height:200px}
.spread canvas{border:1px solid var(--line);box-shadow:0 2px 8px rgba(0,0,0,.2);max-width:100%}
.rv{display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--line)}
.row{display:flex;gap:8px;justify-content:space-between;margin-top:14px;flex-wrap:wrap}
dialog{border:2px solid var(--ink);padding:18px;width:min(480px,94vw);background:var(--bg);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog label{display:block;margin:10px 0 2px;font-size:.9rem;color:var(--mute)}
dialog input,dialog textarea{width:100%;font:inherit;padding:8px;border:1px solid var(--ink);background:var(--bg);color:var(--ink);border-radius:0}
.msg{min-height:1.5em;color:var(--mute)}
footer{border-top:1px solid var(--line);margin-top:40px;padding:20px 0;color:var(--mute);font-size:.85rem}
</style>

</head>
<body>
<header class="mast"><div class="wrap">
  <details id="menu"><summary>☰ Menu</summary><nav id="nav"></nav></details>
  <a class="logo" href="#/">The <i>Newsroom</i></a>
  <div class="right"><button class="red" id="open-up">Upload bestanden</button></div>
</div></header>
<div class="wrap"><div id="status" class="muted" role="status"></div><main id="app"></main><footer>&copy; Verwonderaars · Journalistiek 2026</footer></div>

<dialog id="up">
  <h2 class="serif" style="margin-top:0">Productie uploaden</h2>
  <p class="muted">Maximaal 50 MB. Audio (mp3…), video (mp4…) of de krant (PDF).</p>
  <label for="u-name">Je naam</label><input id="u-name" autocomplete="name">
  <label for="u-title">Titel</label><input id="u-title">
  <label for="u-cat">Kop (Alleen audio!)</label><input id="u-cat" list="cats">
  <datalist id="cats"></datalist>
  <label for="u-desc">Text voor onder de productie (audio and video)</label><textarea id="u-desc" rows="4"></textarea>
  <label for="u-file">File</label><input id="u-file" type="file" accept="audio/*,video/*,.pdf">
  <label for="u-link">Of een YouTube link (verborgen of publiekelijk)</label><input id="u-link" placeholder="https://youtu.be/…">

  <p class="msg" id="u-msg" role="status"></p>
  <div class="row"><button id="u-close">Sluiten</button><button class="red" id="u-go">Publiceren</button></div>
</dialog>

<dialog id="adm">
  <h2 class="serif" style="margin-top:0">Inloggen</h2>
  <label for="a-mail">Email</label><input id="a-mail" type="email" autocomplete="username">
  <label for="a-pass">Wachtwoord</label><input id="a-pass" type="password" autocomplete="current-password">
  <p class="msg" id="a-msg" role="status"></p>
  <div class="row"><button id="a-close">Sluiten</button><button class="red" id="a-go">Inloggen</button></div>
</dialog>


<script>
/* ===== 1. Paste your two Supabase values here (Project Settings → API) ===== */
const SUPABASE_URL = "https://rtgwpfdjcvknrqlzbfni.supabase.co";
const SUPABASE_KEY = "sb_publishable_j0Y6VlpoZRlmpCupVtudTw_yzeJhJru";
/* ========================================================================== */

const INTERVAL = 15000;
const MAX_MB = 50;   // Supabase Free plan limit; bigger videos go in as YouTube/Vimeo links
const EXT = {audio:["mp3","wav","ogg","m4a","aac","flac","oga"], video:["mp4","webm","mov","m4v","ogv"], text:["pdf"]};
const KIND = {audio:"Audio", video:"Video", text:"Newspaper"};
const WORKER = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
const $ = s => document.querySelector(s);
const ext = n => n.split(".").pop().toLowerCase();
const kindOf = n => Object.keys(EXT).find(k=>EXT[k].includes(ext(n)));
function el(t,c,x){ const e=document.createElement(t); if(c) e.className=c; if(x!=null) e.textContent=x; return e; }
function link(t,href,c){ const a=el("a",c,t); a.href=href; return a; }
const app = $("#app");
const configured = !SUPABASE_URL.includes("YOUR-PROJECT");
const sb = configured ? supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;
let items = [], me = null, timer, keyH;
function embedOf(u){
  let m;
  if((m=u.match(/(?:youtube\.com\/(?:watch\?(?:[^#]*&)?v=|shorts\/|embed\/|live\/)|youtu\.be\/)([\w-]{11})/))){
    const id=m[1], b="https://www.youtube-nocookie.com/embed/"+id;
    return {preview:`${b}?autoplay=1&mute=1&controls=0&loop=1&playlist=${id}&playsinline=1&rel=0`, full:`${b}?autoplay=1&rel=0`};
  }
  if((m=u.match(/vimeo\.com\/(?:video\/)?(\d+)(?:\/([a-f0-9]+))?/))){
    const h=m[2]||(u.match(/[?&]h=([a-f0-9]+)/)||[])[1], q=h?`h=${h}&`:"", b="https://player.vimeo.com/video/"+m[1];
    return {preview:`${b}?${q}background=1&autoplay=1&muted=1&loop=1`, full:`${b}?${q}autoplay=1`};
  }
  return null;
}
const byKind = k => items.filter(i=>i.kind===k);
const find = id => items.find(i=>i.id===id);
 
/* ---------- data ---------- */
async function load(){
  if(!configured){ $("#status").textContent="Setup needed: add your Supabase URL and key at the top of index.html."; menu(); show(); return; }
  const {data,error} = await sb.from("files").select("*").order("created_at",{ascending:false});
  if(error){ $("#status").textContent="Could not load files: "+error.message; return; }
  items = data.map(f=>{ const link=/^https?:/.test(f.path); return {...f,link,url:link?f.path:sb.storage.from("media").getPublicUrl(f.path).data.publicUrl}; });
  $("#cats").replaceChildren(...[...new Set(byKind("audio").map(a=>a.category).filter(Boolean))].map(c=>{const o=el("option"); o.value=c; return o;}));
  menu(); show();
}
if(configured) sb.auth.getSession().then(({data})=>{ me=data.session?.user||null; load(); }); else load();
 
/* ---------- menu ---------- */
function menu(){
  const n = $("#nav"); n.replaceChildren(link("Newspaper","#/krant"), link("Audio","#/audio"), link("Video","#/video"));
  const b = el("button",null,me?"Log out":"Login");
  b.onclick = async () => { $("#menu").open=false; if(me){ await sb.auth.signOut(); me=null; location.hash="#/"; load(); } else if(configured){ $("#a-msg").textContent=""; $("#adm").showModal(); } };
  n.append(b);
}
$("#nav").addEventListener("click",()=>setTimeout(()=>$("#menu").open=false));
document.addEventListener("click",e=>{ if(!$("#menu").contains(e.target)) $("#menu").open=false; });
 
/* ---------- router ---------- */
window.addEventListener("hashchange",show);
function show(){
  clearInterval(timer); document.removeEventListener("keydown",keyH); window.scrollTo(0,0); app.replaceChildren();
  const [,p,id] = (location.hash.slice(1)||"/").split("/");
  if(p==="v") article(id,"video"); else if(p==="a") article(id,"audio");
  else if(p==="krant") krant(id);
  else { home(); if(p==="audio"||p==="video") setTimeout(()=>document.getElementById(p)?.scrollIntoView(),50); }
}
const head = (t,href) => { const h=el("h2","kop"); h.append(el("span",null,t)); if(href) h.append(link("All →",href)); return h; };
 
/* ---------- home ---------- */
function home(){
  const l = el("section"); l.id="video"; l.append(head("Video"), slideshow(byKind("video")));
  const au = audioBlocks(); au.id="audio"; app.append(l, au);
}
function slideshow(list){
  const box = el("div"), stage = el("div","stage"); box.append(stage);
  if(!list.length){ box.replaceChildren(el("p","empty","No videos yet.")); return box; }
  const slides = list.map(it=>{
    const a = link("", "#/v/"+it.id, "slide"); let v;
    if(it.link){ v=el("div","emb"); v.dataset.src=embedOf(it.path)?.preview||""; }
    else { v=document.createElement("video"); v.muted=true; v.loop=true; v.playsInline=true; v.preload="metadata"; v.src=it.url; }
    const t = el("div","t",it.name); t.append(el("small",null,"by "+(it.uploader||"unknown")));
    a.append(v,el("span","cover"),t); stage.append(a); return a;
  });
  const prev=el("button",null,"‹"), next=el("button",null,"›"), dots=el("div","dots"), bar=el("div","bar"), fill=el("b");
  prev.setAttribute("aria-label","Previous video"); next.setAttribute("aria-label","Next video");
  list.forEach(()=>dots.append(el("i"))); bar.append(fill);
  const ctl = el("div","ctl"); ctl.append(prev,dots,next); box.append(ctl,bar);
  let i=0,t0=0,hover=false;
  const go = n => { i=(n+list.length)%list.length; slides.forEach((s,j)=>{ s.classList.toggle("on",j===i); const v=s.firstChild;
    if(v.tagName==="DIV"){ v.replaceChildren(); if(j===i&&v.dataset.src){ const f=document.createElement("iframe"); f.src=v.dataset.src; f.allow="autoplay; encrypted-media"; f.title="Video preview"; v.append(f); } }
    else if(j===i){ v.currentTime=0; v.play().catch(()=>{}); } else v.pause(); }); [...dots.children].forEach((d,j)=>d.classList.toggle("on",j===i)); t0=performance.now(); };
  prev.onclick=()=>go(i-1); next.onclick=()=>go(i+1);
  box.onmouseenter=()=>hover=true; box.onmouseleave=()=>{hover=false;t0=performance.now()};
  go(0);
  timer = setInterval(()=>{ if(hover||document.hidden){ t0=performance.now(); fill.style.width="0"; return; }
    const e=performance.now()-t0; fill.style.width=Math.min(100,e/INTERVAL*100)+"%"; if(e>=INTERVAL) go(i+1); },100);
  return box;
}
function audioBlocks(){
  const wrap = el("div"), groups = {};
  byKind("audio").forEach(a=>(groups[a.category||"More audio"] ||= []).push(a));
  const names = Object.keys(groups);
  if(!names.length){ wrap.append(head("Audio"), el("p","empty","No audio yet.")); return wrap; }
  names.forEach(c=>{
    wrap.append(head(c));
    const g = el("div","cards");
    groups[c].forEach(a=>{ const k=link("","#/a/"+a.id,"card"); k.append(el("span","k","Audio"),el("b",null,a.name),el("small",null,"by "+(a.uploader||"unknown"))); g.append(k); });
    wrap.append(g);
  });
  return wrap;
}
/* ---------- audio / video page ---------- */
function article(id,kind){
  const it = find(id);
  if(!it || it.kind!==kind){ app.append(el("p","empty","This production was not found.")); return; }
  const a = el("article","art"), emb = it.link ? embedOf(it.path) : null; let m;
  if(emb){ m=document.createElement("iframe"); m.src=emb.full; m.allow="autoplay; encrypted-media; fullscreen; picture-in-picture"; m.allowFullscreen=true; m.title=it.name; }
  else { m=document.createElement(kind==="video"?"video":"audio"); m.controls=true; m.autoplay=true; m.src=it.url; }
  a.append(link("← Back",kind==="video"?"#/video":"#/audio"), el("div","kick",(it.category||KIND[kind])), el("h1",null,it.name), el("div","muted","by "+(it.uploader||"unknown")+" · "+new Date(it.created_at).toLocaleDateString()), m);
  if(it.description) a.append(el("p",null,it.description));
  a.append(adminBar(it)); app.append(a);
}
function adminBar(it){
  const d = el("div","kbar");
  if(me && (it.owner===me.id || me.app_metadata?.role==="teacher")){ const rm=el("button",null,"Delete"); rm.onclick=()=>removeItem(it); d.append(rm); }
  return d;
}
async function removeItem(it){
  if(!confirm(`Remove ${it.name}?`)) return;
  if(!it.link) await sb.storage.from("media").remove([it.path]);
  const {error}=await sb.from("files").delete().eq("id",it.id);
  if(error) alert(error.message); else { location.hash="#/"; load(); }
}
 
/* ---------- newspaper ---------- */
let wk; const pdfInit = () => wk ||= fetch(WORKER).then(r=>{ if(!r.ok) throw 0; return r.blob(); })
  .then(b=>{ pdfjsLib.GlobalWorkerOptions.workerSrc=URL.createObjectURL(b); })
  .catch(()=>{ pdfjsLib.GlobalWorkerOptions.workerSrc=WORKER; });
async function krant(id){
  const eds = byKind("text"), it = eds.find(e=>e.id===id)||eds[0];
  app.append(el("h1","h1","Newspaper"));
  if(!it){ app.append(el("p","empty","No newspaper has been published yet.")); return; }
  const bar=el("div","kbar"), prev=el("button",null,"‹ Previous"), next=el("button",null,"Next ›"), info=el("span","muted"), dl=el("button","red","Download PDF"), spread=el("div","spread paper");
  if(eds.length>1){ const s=document.createElement("select"); eds.forEach(e=>{ const o=el("option",null,e.name); o.value=e.id; o.selected=e===it; s.append(o); }); s.setAttribute("aria-label","Edition"); s.onchange=()=>location.hash="#/krant/"+s.value; bar.append(s); }
  else bar.append(el("strong",null,it.name));
  bar.append(prev,info,next,dl); app.append(bar,spread,adminBar(it));
  dl.onclick = async () => { const b=await (await fetch(it.url)).blob(), a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download=it.name.replace(/\.pdf$/i,"")+".pdf"; a.click(); };
  spread.textContent="Loading…";
  let pdf;
  try{
    await pdfInit();
    const r = await fetch(it.url); if(!r.ok) throw new Error("download failed, status "+r.status);
    pdf = await pdfjsLib.getDocument({data: await r.arrayBuffer()}).promise;
  }catch(e){
    console.error(e); spread.textContent=`Could not open this PDF (${e.message||e}). `;
    const a=link("Open it in a new tab",it.url); a.target="_blank"; a.rel="noopener"; spread.append(a); return;
  }
  let n=1, seq=0; const per=()=>spread.clientWidth<700?1:2;
  async function draw(){
    const my=++seq, k=per(), w=Math.floor((spread.clientWidth-24-(k-1)*8)/k), cs=[];
    for(let p=n;p<n+k&&p<=pdf.numPages;p++){
      const pg=await pdf.getPage(p), v0=pg.getViewport({scale:1}), vp=pg.getViewport({scale:w/v0.width*(devicePixelRatio||1)}), c=document.createElement("canvas");
      c.width=vp.width; c.height=vp.height; c.style.width=w+"px"; await pg.render({canvasContext:c.getContext("2d"),viewport:vp}).promise; cs.push(c);
    }
    if(my!==seq) return;
    spread.replaceChildren(...cs);
    info.textContent=`Page ${n}${cs.length>1?"–"+(n+1):""} of ${pdf.numPages}`;
    prev.disabled=n<=1; next.disabled=n+k>pdf.numPages;
  }
  const flip = d => { const k=per(), m=Math.min(Math.max(1,n+d*k),pdf.numPages); if(m!==n){ n=m; draw(); } };
  prev.onclick=()=>flip(-1); next.onclick=()=>flip(1);
  keyH = e => { if(e.key==="ArrowRight") flip(1); if(e.key==="ArrowLeft") flip(-1); };
  document.addEventListener("keydown",keyH);
  draw();
}
 
/* ---------- upload (logged-in accounts only) ---------- */
function needLogin(msg){ $("#a-msg").textContent=msg||""; $("#adm").showModal(); }
$("#open-up").onclick = () => {
  if(!configured) return;
  if(!me) return needLogin("Log in to upload.");
  $("#u-msg").textContent=""; $("#up").showModal();
};
$("#u-close").onclick = () => $("#up").close();
const um = t => $("#u-msg").textContent = t;
$("#u-go").onclick = async () => {
  if(!me) return um("Please log in first.");
  const f=$("#u-file").files[0], who=$("#u-name").value.trim(), lnk=$("#u-link").value.trim();
  if(!who) return um("Add your name.");
  if(!f && !lnk) return um("Choose a file or paste a video link.");
  if(f && lnk) return um("Use either a file or a link, not both.");
  let kind, path;
  if(lnk){ if(!embedOf(lnk)) return um("Use a YouTube or Vimeo link."); kind="video"; path=lnk; }
  else {
    kind=kindOf(f.name); if(!kind) return um("File type not supported.");
    if(f.size>MAX_MB*1024*1024) return um(`That file is over ${MAX_MB} MB. Upload big videos to YouTube or Vimeo and paste the link instead.`);
    path=crypto.randomUUID()+"."+ext(f.name);
  }
  const title=$("#u-title").value.trim()||(f?f.name.replace(/\.[^.]+$/,""):"");
  if(!title) return um("Add a title.");
  const cat=kind==="audio"?($("#u-cat").value.trim()||"More audio"):null, desc=kind==="text"?null:$("#u-desc").value.trim()||null;
  $("#u-go").disabled=true; um("Publishing…");
  if(f){
    const r2=await sb.storage.from("media").upload(path,f,{contentType:f.type||undefined});
    if(r2.error){ $("#u-go").disabled=false; return um("Upload failed: "+r2.error.message); }
  }
  const r1=await sb.from("files").insert({name:title,kind,path,uploader:who,category:cat,description:desc});
  $("#u-go").disabled=false;
  if(r1.error){ if(f) await sb.storage.from("media").remove([path]); return um("Could not save: "+r1.error.message); }
  um("Published!"); ["#u-title","#u-cat","#u-desc","#u-file","#u-link"].forEach(x=>$(x).value=""); load();
};
 
/* ---------- login ---------- */
$("#a-close").onclick = () => $("#adm").close();
$("#a-go").onclick = async () => {
  const {data,error}=await sb.auth.signInWithPassword({email:$("#a-mail").value.trim(),password:$("#a-pass").value});
  if(error) return $("#a-msg").textContent="Login failed: "+error.message;
  me=data.user; $("#a-pass").value=""; $("#adm").close(); load();
};

</script>
</body>
</html>
